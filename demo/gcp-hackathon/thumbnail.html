<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DuckFleet — YouTube Thumbnail</title>
<!--
  YouTube thumbnail (1280x720, 16:9). Open in a browser, full-screen at 720p+, screenshot the stage.
  OPTIONAL: drop a frame from your duck->business-class Veo clip at assets/hero.jpg (or .png) and it
  fills the right side; otherwise a branded gradient shows. Keep text BIG — thumbnails are read small.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0b1020; --ink:#ffffff; --duck:#ffd54a; --coral:#ff6b5e; --muted:#b9c6e6}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#05070f;font-family:"Nunito",system-ui,Arial,sans-serif}
  .wrap{min-height:100vh;display:grid;place-items:center}
  .stage{position:relative;width:1280px;height:720px;overflow:hidden;color:var(--ink);
    background:radial-gradient(900px 600px at 78% 30%, #23306a 0%, var(--navy) 55%, #05070f 100%);
    transform:scale(calc(min(100vw/1280,100vh/720)));transform-origin:center}
  .stars{position:absolute;inset:0;opacity:.6;background-image:
    radial-gradient(2px 2px at 15% 25%,#fff9 0,transparent 100%),
    radial-gradient(1.5px 1.5px at 60% 15%,#fff7 0,transparent 100%),
    radial-gradient(1.5px 1.5px at 35% 70%,#fff6 0,transparent 100%),
    radial-gradient(1.5px 1.5px at 88% 60%,#fff7 0,transparent 100%)}
  /* optional hero frame on the right */
  .hero{position:absolute;top:0;right:0;width:52%;height:100%;
    background-image:url('assets/hero.jpg');background-size:cover;background-position:center;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%);
    mask-image:linear-gradient(90deg,transparent 0,#000 38%)}
  .content{position:absolute;inset:0;padding:70px 74px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-size:26px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--coral)}
  h1{margin-top:16px;font-size:92px;line-height:.98;font-weight:900;max-width:820px;
    text-shadow:0 4px 30px #000a}
  h1 .y{color:var(--duck)}
  .sub{margin-top:22px;font-size:36px;font-weight:800;color:var(--muted);max-width:760px;
    text-shadow:0 2px 16px #000a}
  .brand{position:absolute;left:74px;bottom:56px;display:flex;align-items:center;gap:14px}
  .brand .d{font-size:52px}
  .brand .t{font-size:44px;font-weight:900}
  .brand .t span{color:var(--duck)}
  .arrow{position:absolute;right:70px;bottom:60px;font-size:60px;filter:drop-shadow(0 4px 20px #000a)}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="stars"></div>
    <div class="hero"></div>
    <div class="content">
      <div class="eyebrow">Governed AI agents · Google Cloud</div>
      <h1>The $3.50 duck that books <span class="y">business class</span></h1>
      <div class="sub">Autonomous agents that hunt loyalty points while you sleep.</div>
    </div>
    <div class="brand"><span class="d">🦆</span><span class="t">Duck<span>Fleet</span></span></div>
    <div class="arrow">🦆&nbsp;→&nbsp;✈️</div>
  </div>
</div>
</body>
</html>
